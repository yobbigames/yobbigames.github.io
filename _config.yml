title: Yobbi Games
tagline: Games for friends
description: "Yobbi Games is an independent studio making co-op and party games for Steam, and card and word games for your phone."
url: "https://www.yobbigames.com"
baseurl: ""
email: info@yobbigames.com
lang: en
locale: en_US
logo: /assets/img/brand/og.png

twitter:
  username: yobbigames
  card: summary_large_image
social:
  name: Yobbi Games
  links:
    - https://www.youtube.com/@yobbigames
    - https://www.tiktok.com/@yobbigames
    - https://instagram.com/yobbigames
    - https://x.com/yobbigames
    - https://facebook.com/yobbigames
    - https://www.linkedin.com/company/yobbigames

markdown: kramdown
permalink: pretty
theme: null   # no theme: the github-pages gem would otherwise pull in Primer

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

defaults:
  - scope:
      path: ""
    values:
      layout: page
      image: /assets/img/brand/og.png
  - scope:
      path: "games"
    values:
      layout: game

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
